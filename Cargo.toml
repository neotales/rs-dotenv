[package]
name = "neotales-dotenv"
description = "Parse, edit and write dotenv documents with no I/O, no interpolation and no key policy"
version = "0.0.0-alpha.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/neotales/rs-dotenv"
authors = ["x0craft"]
readme = "README.md"
keywords = ["dotenv", "env", "parser", "configuration"]
categories = ["parser-implementations", "config"]

[dependencies]
indexmap = "2.12"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
